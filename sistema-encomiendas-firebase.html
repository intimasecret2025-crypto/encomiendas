<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--sur:#131829;--sur2:#1a2236;--bor:#1f2d4a;
  --acc:#00d4ff;--acc2:#ff6b35;--grn:#00e5a0;--red:#ff4d6d;--yel:#ffd166;
  --txt:#e2e8f8;--mut:#5a6a8a;
  --font:'Syne',sans-serif;--mono:'DM Mono',monospace;
}
html,body,#root{min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font)}
.app{min-height:100vh;display:flex;flex-direction:column}
/* Header */
.hdr{background:linear-gradient(135deg,#0d1526,#121e38);border-bottom:1px solid var(--bor);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#0080a0);display:flex;align-items:center;justify-content:center;font-size:17px}
.hdr-title{font-size:16px;font-weight:800}
.hdr-sub{font-size:10px;color:var(--mut);font-family:var(--mono);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{background:var(--sur2);border:1px solid var(--bor);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%}
.dot-grn{background:var(--grn);animation:pulse 2s infinite}
.dot-red{background:var(--red)}
.dot-yel{background:var(--yel)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Main */
.main{flex:1;padding:16px;max-width:1400px;width:100%;margin:0 auto}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bor);background:var(--sur);color:var(--mut);transition:all .2s}
.tab.on{background:var(--acc);color:#000;border-color:var(--acc)}
.tab:not(.on):hover{border-color:var(--acc);color:var(--acc)}
/* Card */
.card{background:var(--sur);border:1px solid var(--bor);border-radius:13px;padding:20px;margin-bottom:16px}
.card-ttl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.card-ttl span{color:var(--acc)}
/* Form */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.flbl{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.finp{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:8px 11px;color:var(--txt);font-family:var(--font);font-size:13px;width:100%;transition:border-color .2s}
.finp:focus{outline:none;border-color:var(--acc)}
.finp::placeholder{color:var(--mut)}
select.finp{appearance:none;cursor:pointer}
/* Buttons */
.btn{padding:9px 18px;border-radius:8px;font-family:var(--font);font-weight:700;font-size:13px;cursor:pointer;border:none;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:var(--acc);color:#000}
.btn-pri:hover:not(:disabled){background:#00b8d9}
.btn-grn{background:var(--grn);color:#000}
.btn-grn:hover:not(:disabled){background:#00c48a}
.btn-red{background:var(--red);color:#fff}
.btn-gho{background:transparent;color:var(--mut);border:1px solid var(--bor)}
.btn-gho:hover{border-color:var(--acc);color:var(--acc)}
.btn-yel{background:var(--yel);color:#000}
.btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--sur);border:1px solid var(--bor);border-radius:11px;padding:13px}
.stat-lbl{font-size:10px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stat-val{font-size:20px;font-weight:800;margin-top:3px;font-family:var(--mono)}
.c-acc{color:var(--acc)}.c-grn{color:var(--grn)}.c-yel{color:var(--yel)}.c-red{color:var(--red)}.c-acc2{color:var(--acc2)}
/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700}
.b-in{background:rgba(0,229,160,.15);color:var(--grn)}
.b-out{background:rgba(255,107,53,.15);color:var(--acc2)}
.b-proc{background:rgba(255,209,0,.15);color:var(--yel)}
.b-rev{background:rgba(255,77,109,.15);color:var(--red)}
.b-agr{background:rgba(0,212,255,.15);color:var(--acc)}
/* Table */
.twrap{overflow-x:auto;border-radius:11px;border:1px solid var(--bor)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--sur2)}
th{padding:9px 11px;text-align:left;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 11px;border-top:1px solid var(--bor);vertical-align:middle;white-space:nowrap}
tr:hover td{background:rgba(0,212,255,.03)}
/* Cierre banner */
.cierre{background:linear-gradient(135deg,rgba(0,229,160,.1),rgba(0,212,255,.06));border:1px solid rgba(0,229,160,.25);border-radius:11px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
/* Separador de grupos en tabla */
.grp-hdr td{background:var(--sur2)!important;padding:7px 12px;font-weight:800;font-size:11px;color:var(--acc);border-top:2px solid var(--bor);letter-spacing:.05em}
/* Abonos */
.ab-row{display:flex;align-items:center;gap:8px;background:var(--sur2);border:1px solid var(--bor);border-radius:7px;padding:7px 11px;margin-bottom:5px}
.ab-monto{font-family:var(--mono);font-weight:700;color:var(--grn);font-size:13px;flex:1}
.ab-fecha{font-size:10px;color:var(--mut);font-family:var(--mono)}
.ab-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:2px 5px}
.ab-resumen{display:flex;justify-content:space-between;padding:9px 11px;background:rgba(0,229,160,.07);border-radius:7px;border:1px solid rgba(0,229,160,.2);margin-top:6px;font-size:12px}
.ab-resumen2{display:flex;justify-content:space-between;padding:9px 11px;background:rgba(255,107,53,.07);border-radius:7px;border:1px solid rgba(255,107,53,.2);margin-top:4px;font-size:12px}
/* Moto cards */
.moto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
.moto-card{background:var(--sur);border:1px solid var(--bor);border-radius:13px;padding:15px}
.moto-card.pend{border-color:rgba(0,229,160,.4);background:rgba(0,229,160,.03)}
.moto-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.moto-fact{font-family:var(--mono);font-size:11px;color:var(--mut)}
.moto-row{display:flex;gap:7px;font-size:12px;margin-bottom:5px;color:var(--mut)}
.moto-val{color:var(--txt);font-weight:600;flex:1}
/* Imágenes */
.img-prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-thumb{position:relative;width:75px;height:75px;border-radius:8px;overflow:hidden;border:1px solid var(--bor);cursor:pointer}
.img-thumb img{width:100%;height:100%;object-fit:cover}
.img-del{position:absolute;top:2px;right:2px;background:rgba(255,77,109,.9);border:none;border-radius:50%;width:18px;height:18px;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:500;cursor:pointer;padding:16px}
.img-overlay img{max-width:100%;max-height:90vh;border-radius:10px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--sur);border:1px solid var(--bor);border-radius:15px;padding:24px;max-width:480px;width:100%;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-ttl{font-size:16px;font-weight:800;margin-bottom:10px}
.modal-body{color:var(--mut);font-size:13px;line-height:1.7;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grn);color:#000;padding:11px 20px;border-radius:10px;font-weight:700;font-size:13px;z-index:300;animation:fadeIn .3s ease;white-space:nowrap;max-width:90vw;text-align:center}
.toast.err{background:var(--red);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.divider{border:none;border-top:1px solid var(--bor);margin:16px 0}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty-ico{font-size:36px;margin-bottom:10px}
.spin-wrap{display:flex;align-items:center;justify-content:center;padding:50px;gap:11px;color:var(--mut);font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--bor);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px}
.radio-btn{display:flex;align-items:center;gap:7px;cursor:pointer;padding:8px 15px;background:var(--sur2);border-radius:8px;border:1px solid var(--bor);color:var(--mut);font-weight:700;font-size:12px;transition:all .18s}
.radio-btn.on{background:var(--acc);color:#000;border-color:var(--acc)}
.radio-btn input{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const ASESORAS = ["Vannesa","Elizabeth","Natasha","Estefany","Angélica"];
const TIENDAS  = ["Central 1","Central 2","Central 3","Central 4","Tienda Pequeña","Outlet Calle 8","Tienda Esquinera","Mom and Baby"];
const MEDALLAS = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣"];

const fmt = n => new Intl.NumberFormat("es-CR",{style:"currency",currency:"CRC"}).format(n||0);
const fmtD = d => d ? new Date(d+"T00:00:00").toLocaleDateString("es-CR") : "—";
const nowDT = () => { const d=new Date(); return {date:d.toISOString().split("T")[0],time:d.toTimeString().slice(0,5)}; };

const EMPTY = {
  fechaIngreso:"",horaIngreso:"",numeroCliente:"",numeroPaga:"",
  nombreDepositante:"",numeroFactura:"",ventaTotal:"",comision:"",
  fechaSalida:"",envio:"",sello:"",horaSalida:"",
  nombreAsesora:"",tipoVenta:"asesora",tienda:"",
  tipoEntrega:"envio",estado:"ingresado",
  imagenes:[],abonos:[]
};

function sinTilde(s){ return (s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function esAngel(p){ return sinTilde(p.envio)==="el angel"; }
const ESTADOS_NO_MOTO = new Set(["en_proceso","falta_revisar","agrega"]);
function paraMotorizado(p){ return !ESTADOS_NO_MOTO.has(p.estado) && p.tipoEntrega!=="retiro" && !esAngel(p); }

function buildReport(pkgs,date){
  const tot = pkgs.reduce((s,p)=>s+Number(p.ventaTotal||0),0);
  const com = pkgs.reduce((s,p)=>s+Number(p.comision||0),0);
  const filas = pkgs.map((p,i)=>`<tr style="background:${i%2===0?"#f9fafb":"#fff"}">
    <td>${i+1}</td><td>${fmtD(p.fechaIngreso)}</td><td>${p.horaIngreso||"—"}</td>
    <td>${p.numeroFactura||"—"}</td><td>${p.numeroCliente||"—"}</td><td>${p.numeroPaga||"—"}</td>
    <td>${p.nombreDepositante||"—"}</td><td>${fmt(p.ventaTotal)}</td><td>${fmt(p.comision)}</td>
    <td>${fmtD(p.fechaSalida)}</td><td>${p.envio||"—"}</td><td>${p.sello||"—"}</td><td>${p.horaSalida||"—"}</td>
    <td>${p.tipoVenta==="tienda"?"🏪 "+p.tienda:"👩 "+p.nombreAsesora}</td>
    <td><b style="color:${p.estado==="salida"?"#059669":"#d97706"}">${p.estado==="salida"?"SALIDA":p.estado==="en_proceso"?"EN PROCESO":p.estado==="falta_revisar"?"FALTA REVISAR":p.estado==="agrega"?"AGREGA":"INGRESADO"}</b></td>
  </tr>`).join("");
  const aseRank = ASESORAS.map(n=>{ const pa=pkgs.filter(p=>p.nombreAsesora===n&&p.tipoVenta!=="tienda"); return {n,v:pa.reduce((s,p)=>s+Number(p.ventaTotal||0),0),c:pa.reduce((s,p)=>s+Number(p.comision||0),0),q:pa.length}; }).sort((a,b)=>b.v-a.v);
  const tieRank = TIENDAS.map(n=>{ const pt=pkgs.filter(p=>p.tienda===n&&p.tipoVenta==="tienda"); return {n,v:pt.reduce((s,p)=>s+Number(p.ventaTotal||0),0),c:pt.reduce((s,p)=>s+Number(p.comision||0),0),q:pt.length}; }).sort((a,b)=>b.v-a.v);
  const meds = ["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣"];
  const rA = aseRank.map((a,i)=>`<tr><td>${meds[i]}</td><td><b>${a.n}</b></td><td>${a.q}</td><td style="color:#059669;font-weight:700">${fmt(a.v)}</td><td style="color:#b45309;font-weight:700">${fmt(a.c)}</td></tr>`).join("");
  const rT = tieRank.map((t,i)=>`<tr><td>${meds[i]}</td><td><b>${t.n}</b></td><td>${t.q}</td><td style="color:#059669;font-weight:700">${fmt(t.v)}</td><td style="color:#b45309;font-weight:700">${fmt(t.c)}</td></tr>`).join("");
  // Totales separados para el reporte
  const totAse = pkgs.filter(p=>p.tipoVenta!=="tienda").reduce((s,p)=>s+Number(p.ventaTotal||0),0);
  const comAse = pkgs.filter(p=>p.tipoVenta!=="tienda").reduce((s,p)=>s+Number(p.comision||0),0);
  const totTie = pkgs.filter(p=>p.tipoVenta==="tienda").reduce((s,p)=>s+Number(p.ventaTotal||0),0);
  const comTie = pkgs.filter(p=>p.tipoVenta==="tienda").reduce((s,p)=>s+Number(p.comision||0),0);
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;padding:20px;color:#1a1a2e;font-size:12px}h1{font-size:20px;margin-bottom:4px}h2{font-size:14px;margin:22px 0 8px;padding:6px 12px;border-radius:6px;display:inline-block}h2.a{background:#dbeafe;color:#1e40af}h2.t{background:#fef9c3;color:#854d0e}table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px}th{background:#1a2236;color:#fff;padding:7px;text-align:left;white-space:nowrap}td{padding:6px 8px;border-bottom:1px solid #e5e7eb;vertical-align:middle}.res{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.res-sec{border-radius:10px;padding:14px;border:1px solid #e5e7eb}.res-ttl{font-size:12px;font-weight:800;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #e5e7eb}.rc{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f3f4f6}.rl{font-size:10px;color:#666;text-transform:uppercase}.rv{font-size:16px;font-weight:800}</style></head><body>
  <h1>📦 Reporte de Encomiendas — ${date}</h1>
  <p style="color:#666;font-size:11px;margin-bottom:16px">Total paquetes: <b>${pkgs.length}</b> &nbsp;|&nbsp; Salidas: <b>${pkgs.filter(p=>p.estado==="salida").length}</b> &nbsp;|&nbsp; Pendientes: <b>${pkgs.filter(p=>p.estado!=="salida").length}</b></p>
  <div class="res">
    <div class="res-sec" style="background:#f0fdf4">
      <div class="res-ttl" style="color:#166534">👩 Cierre Asesoras</div>
      <div class="rc"><span class="rl">Venta Total</span><span class="rv" style="color:#059669">${fmt(totAse)}</span></div>
      <div class="rc"><span class="rl">Comisión Total</span><span class="rv" style="color:#059669;font-size:18px">${fmt(comAse)}</span></div>
      <div class="rc"><span class="rl">Paquetes</span><span class="rv" style="color:#1d4ed8">${pkgs.filter(p=>p.tipoVenta!=="tienda").length}</span></div>
    </div>
    <div class="res-sec" style="background:#fefce8">
      <div class="res-ttl" style="color:#854d0e">🏪 Cierre Tiendas</div>
      <div class="rc"><span class="rl">Venta Total</span><span class="rv" style="color:#059669">${fmt(totTie)}</span></div>
      <div class="rc"><span class="rl">Comisión Total</span><span class="rv" style="color:#059669;font-size:18px">${fmt(comTie)}</span></div>
      <div class="rc"><span class="rl">Paquetes</span><span class="rv" style="color:#1d4ed8">${pkgs.filter(p=>p.tipoVenta==="tienda").length}</span></div>
    </div>
  </div>
  <h2 class="a">👩 Ranking Asesoras</h2>
  <table><thead><tr><th></th><th>Asesora</th><th>Paquetes</th><th>Venta</th><th>Comisión</th></tr></thead><tbody>${rA}</tbody></table>
  <h2 class="t">🏪 Ranking Tiendas</h2>
  <table><thead><tr><th></th><th>Tienda</th><th>Paquetes</th><th>Venta</th><th>Comisión</th></tr></thead><tbody>${rT}</tbody></table>
  <h2 style="background:#f3f4f6;color:#374151">📋 Detalle de Paquetes</h2>
  <table><thead><tr><th>#</th><th>F.Ingreso</th><th>Hora</th><th>Factura</th><th>Cliente</th><th>Paga a</th><th>Depositante</th><th>Venta</th><th>Comisión</th><th>F.Salida</th><th>Envío</th><th>Sello</th><th>H.Salida</th><th>Asesora/Tienda</th><th>Estado</th></tr></thead><tbody>${filas}</tbody></table>
  </body></html>`;
}

function App(){
  const [pkgs,setPkgs]   = useState([]);
  const [loading,setLd]  = useState(true);
  const [online,setOnl]  = useState(false);
  const [tab,setTab]     = useState("registro");
  const [form,setForm]   = useState({...EMPTY,...nowDT()});
  const [editId,setEdit] = useState(null);
  const [jefe,setJefe]   = useState(()=>localStorage.getItem("jefeMail")||"");
  const [toast,setToast] = useState(null);
  const [modal,setModal] = useState(null);
  const [saving,setSav]  = useState(false);
  const [imgView,setImg] = useState(null);
  const [clock,setClock] = useState("");
  const [closed,setClosed]= useState(()=>localStorage.getItem("closedDate")===new Date().toISOString().split("T")[0]);
  const [filtVend,setFiltVend] = useState("todos");
  const [datosTienda,setDatosTienda] = useState({}); // { "YYYY-MM-DD_Asesora": monto }
  const [filtFecha,setFiltFecha] = useState("");
  const [filtRanking,setFiltRanking] = useState(""); // fecha YYYY-MM-DD o vacío = total

  // Reloj
  useEffect(()=>{

  const sendReport=useCallback(async(list)=>{
    const today=new Date().toISOString().split("T")[0];

    try{
      await window.emailjs.send("service_hjsr4ul","template_56jg3rs",{

        total_paquetes:list.length,

    URL.revokeObjectURL(url);
  },[]);

  const rankTie=TIENDAS.map(n=>{ const pt=pkgsRank.filter(p=>p.tienda===n&&p.tipoVenta==="tienda"); return{n,v:pt.reduce((s,p)=>s+Number(p.ventaTotal||0),0),c:pt.reduce((s,p)=>s+Number(p.comision||0),0),q:pt.length}; }).sort((a,b)=>b.c-a.c);
  const maxV=Math.max(...rankAse.map(a=>a.c),...rankTie.map(t=>t.c),1);

  const tLeft=()=>{ const d=new Date(),c=new Date(); c.setHours(19,0,0,0); const diff=c-d; if(diff<=0)return null; const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000); return h>0?`${h}h ${m}min`:`${m}min`; };

  const campos=[

    ["nombreDepositante","Nombre Depositante *","text"],
    ["horaIngreso","Hora Ingreso *","time"],

    ["comision","Comisión (₡)","number"],

  // Paquetes filtrados
  const ORDEN=[...ASESORAS,...TIENDAS];

    : pkgs.filter(p=>(p.nombreAsesora===filtVend)||(p.tienda===filtVend));
  if(filtFecha) pkgsVista=pkgsVista.filter(p=>p.fechaIngreso===filtFecha);
  const totVista=pkgsVista.reduce((s,p)=>s+Number(p.ventaTotal||0),0);
  const comVista=pkgsVista.reduce((s,p)=>s+Number(p.comision||0),0);

  const opsFiltro=[{val:"todos",lbl:"👁️ Todos"},...ASESORAS.map(a=>({val:a,lbl:"👩 "+a})),...TIENDAS.map(t=>({val:t,lbl:"🏪 "+t}))];

  // En proceso
  const enProceso=pkgs.filter(p=>ESTADOS_NO_MOTO.has(p.estado)&&p.estado!=="salida");

  const paraMoto=pkgs.filter(paraMotorizado);

  const diasUnicos = [...new Set(pkgs.map(p=>p.fechaIngreso).filter(Boolean))].sort((a,b)=>b.localeCompare(a));

      return { dia, com: comPkgs, dato, total: comPkgs+dato, q: pDia.length };
    }).filter(d=>d.q>0||d.dato>0);

  return (

                  </div>

            </div>
          </div>
        )}

                <span>📅</span>
                <span style={{fontSize:11,color:"var(--mut)",fontWeight:700,textTransform:"uppercase"}}>Día:</span>
                <input type="date" className="finp" style={{border:"none",background:"transparent",padding:0,width:"auto",fontSize:13}} value={filtFecha} onChange={e=>setFiltFecha(e.target.value)}/>
              </div>
              {filtFecha&&<button className="btn btn-gho" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>setFiltFecha("")}>✕ Todos los días</button>}

            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:11}}>
              {opsFiltro.map(op=>(
                <button key={op.val} onClick={()=>setFiltVend(op.val)}
                  style={{padding:"6px 13px",borderRadius:8,fontSize:11,fontWeight:700,cursor:"pointer",border:"1px solid",
                    background:filtVend===op.val?"var(--acc)":"var(--sur)",
                    borderColor:filtVend===op.val?"var(--acc)":"var(--bor)",
                    color:filtVend===op.val?"#000":"var(--mut)"}}>

                </button>
              ))}
            </div>

              </div>

                      {(()=>{ let lastG=null; return pkgsVista.map((p,i)=>{

                          <React.Fragment key={p._key||i}>
                            {newG&&<tr className="grp-hdr"><td colSpan="18">{p.tipoVenta==="tienda"?"🏪":"👩"} {g||"Sin asignar"} <span style={{fontWeight:400,color:"var(--mut)",fontSize:10}}>({pkgs.filter(x=>(x.nombreAsesora===g||x.tienda===g)).length} paq)</span></td></tr>}

                              <td style={{color:"var(--mut)",fontFamily:"var(--mono)"}}>{i+1}</td>
                              <td><span className={"badge "+(p.estado==="salida"?"b-out":p.estado==="en_proceso"?"b-proc":p.estado==="falta_revisar"?"b-rev":p.estado==="agrega"?"b-agr":"b-in")}>{p.estado==="salida"?"SALIDA":p.estado==="en_proceso"?"EN PROCESO":p.estado==="falta_revisar"?"FALTA REVISAR":p.estado==="agrega"?"AGREGA":"INGRESADO"}</span></td>
                              <td>{fmtD(p.fechaIngreso)}</td>
                              <td style={{fontFamily:"var(--mono)"}}>{p.horaIngreso||"—"}</td>
                              <td style={{fontFamily:"var(--mono)"}}>{p.numeroFactura||"—"}</td>
                              <td>{p.numeroCliente}</td>
                              <td>{p.numeroPaga||"—"}</td>
                              <td style={{fontWeight:600}}>{p.nombreDepositante}</td>
                              <td style={{color:"var(--grn)",fontFamily:"var(--mono)"}}>{fmt(p.ventaTotal)}</td>
                              <td style={{color:"var(--grn)",fontFamily:"var(--mono)",fontWeight:700}}>{fmt(p.comision)}</td>
                              <td>{p.envio||"—"}</td>
                              <td>{p.sello||"—"}</td>
                              <td>{p.imagenes&&p.imagenes.length>0?<div style={{display:"flex",gap:3}}>{p.imagenes.slice(0,3).map((s,j)=><div key={j} style={{width:26,height:26,borderRadius:4,overflow:"hidden",border:"1px solid var(--bor)",cursor:"pointer"}} onClick={()=>setImg(s)}><img src={s} style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>)}{p.imagenes.length>3&&<span style={{fontSize:10,color:"var(--mut)",alignSelf:"center"}}>+{p.imagenes.length-3}</span>}</div>:<span style={{color:"var(--mut)",fontSize:11}}>—</span>}</td>
                              <td>{fmtD(p.fechaSalida)}</td>
                              <td style={{fontFamily:"var(--mono)"}}>{p.horaSalida||"—"}</td>
                              <td><span style={{fontSize:10,padding:"2px 7px",borderRadius:5,background:p.tipoVenta==="tienda"?"rgba(255,209,0,.15)":"rgba(0,212,255,.15)",color:p.tipoVenta==="tienda"?"var(--yel)":"var(--acc)"}}>{p.tipoVenta==="tienda"?"🏪":"👩"}</span></td>

                                <button className="btn btn-red" style={{padding:"4px 8px",fontSize:11}} onClick={()=>handleDelete(p)}>🗑️</button>
                              </div></td>
                            </tr>
                          </React.Fragment>
                        );
                      }); })()}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>

                {enProceso.map(p=>{
                  const totAb=(p.abonos||[]).reduce((s,a)=>s+Number(a.monto||0),0);
                  const saldo=Math.max(0,Number(p.ventaTotal||0)-totAb);
                  return(
                    <div key={p._key} style={{background:"var(--sur)",border:"1px solid rgba(255,209,0,.3)",borderRadius:13,padding:16}}>

                        <div>
                          <div style={{fontWeight:800,fontSize:15}}>{p.nombreDepositante||"—"}</div>
                          <div style={{fontSize:11,color:"var(--mut)",fontFamily:"var(--mono)"}}>Cliente: {p.numeroCliente} · Factura: {p.numeroFactura||"S/F"} · {p.tipoVenta==="tienda"?"🏪 "+p.tienda:"👩 "+p.nombreAsesora}</div>
                        </div>
                        <span className={"badge "+(p.estado==="falta_revisar"?"b-rev":p.estado==="agrega"?"b-agr":"b-proc")}>{p.estado==="falta_revisar"?"🔍 FALTA REVISAR":p.estado==="agrega"?"➕ AGREGA":"⏳ EN PROCESO"}</span>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
                        {[["Total pedido",fmt(p.ventaTotal||0),"var(--txt)"],["Total abonado",fmt(totAb),"var(--grn)"],["Saldo pendiente",fmt(saldo),saldo>0?"var(--acc2)":"var(--grn)"]].map(([l,v,c])=>(
                          <div key={l} style={{background:"var(--sur2)",borderRadius:8,padding:"9px 11px"}}>
                            <div style={{fontSize:9,color:"var(--mut)",fontWeight:600,textTransform:"uppercase"}}>{l}</div>
                            <div style={{fontFamily:"var(--mono)",fontWeight:800,color:c,fontSize:14}}>{v}</div>
                          </div>
                        ))}
                      </div>
                      {p.abonos&&p.abonos.length>0&&(
                        <div style={{marginBottom:11}}>
                          <div style={{fontSize:10,color:"var(--mut)",fontWeight:700,marginBottom:5,textTransform:"uppercase",letterSpacing:".05em"}}>Historial de abonos</div>
                          {p.abonos.map((ab,i)=>(
                            <div key={i} className="ab-row">
                              <span className="ab-monto">{fmt(ab.monto)}</span>
                              <span className="ab-fecha">{fmtD(ab.fecha)} · {ab.hora}</span>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{display:"flex",gap:8,marginBottom:10}}>
                        <input id={"ab-"+p._key} className="finp" type="number" placeholder="Nuevo abono (₡)" style={{flex:1}}/>

                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <button className="btn btn-pri" style={{flex:1,justifyContent:"center"}} onClick={()=>handleCerrar(p)}>✅ Cerrar pedido — pasar a paquetes listos</button>
                        <button className="btn btn-gho" style={{padding:"9px 13px"}} onClick={()=>handleEdit(p)}>✏️</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ── TAB MOTORIZADO ── */}
        {tab==="motorizado"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:13,flexWrap:"wrap",gap:8}}>

              <span style={{background:"rgba(0,229,160,.15)",color:"var(--grn)",padding:"4px 13px",borderRadius:8,fontSize:12,fontWeight:700}}>🛵 {paraMoto.filter(p=>p.estado!=="salida").length} pendientes</span>
            </div>
            {loading?<div className="spin-wrap"><div className="spinner"/>Conectando...</div>

              <div className="moto-grid">
                {paraMoto.map((p,i)=>(
                  <div key={p._key||i} className={"moto-card"+(p.estado!=="salida"?" pend":"")}>
                    <div className="moto-top">
                      <span className={"badge "+(p.estado==="salida"?"b-out":"b-in")}>{p.estado==="salida"?"✅ SALIDA":"🛵 ENVÍO"}</span>
                      <span className="moto-fact">#{i+1} · {p.numeroFactura||"S/F"}</span>
                    </div>
                    <div className="moto-row"><span>👤</span><span className="moto-val">{p.nombreDepositante}</span></div>
                    <div className="moto-row"><span>📱</span><span className="moto-val">Cliente: {p.numeroCliente}</span></div>
                    <div className="moto-row"><span>📅</span><span className="moto-val">{fmtD(p.fechaIngreso)} {p.horaIngreso}</span></div>
                    {p.envio&&<div className="moto-row"><span>📦</span><span className="moto-val">{p.envio}</span></div>}
                    {p.sello&&<div className="moto-row"><span>🔖</span><span className="moto-val">{p.sello}</span></div>}
                    <div className="moto-row"><span>{p.tipoVenta==="tienda"?"🏪":"👩"}</span><span className="moto-val">{p.tipoVenta==="tienda"?(p.tienda||"—"):(p.nombreAsesora||"—")}</span></div>

                  </div>
                ))}
              </div>
            )}
          </div>
        )}

                  <div style={{background:"var(--sur2)",padding:"13px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid var(--bor)"}}>
                    <div style={{fontWeight:800,fontSize:15}}>👩 {ase}</div>
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:10,color:"var(--mut)",fontWeight:600,textTransform:"uppercase"}}>Total comisión</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:18,fontWeight:800,color:"var(--grn)"}}>{fmt(totalMes)}</div>
                      </div>
                    </div>
                  </div>
                  {/* Días */}
                  {/* Agregar dato de tienda manual por fecha */}
                  <div style={{padding:"12px 16px",borderBottom:"1px solid var(--bor)"}}>
                    <div style={{fontSize:10,color:"var(--acc)",fontWeight:700,textTransform:"uppercase",marginBottom:7}}>🏪 Agregar Dato de Tienda</div>
                    <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
                      <input type="date" id={"fecha-dt-"+ase.replace(/ /g,"_")}

                        style={{background:"var(--sur2)",border:"1px solid var(--bor)",borderRadius:7,padding:"7px 10px",color:"var(--txt)",fontFamily:"var(--mono)",fontSize:12}}/>
                      <input type="number" id={"monto-dt-"+ase.replace(/ /g,"_")}
                        placeholder="Monto (₡)"
                        style={{flex:1,minWidth:120,background:"var(--sur2)",border:"1px solid var(--bor)",borderRadius:7,padding:"7px 10px",color:"var(--txt)",fontFamily:"var(--mono)",fontSize:12}}/>
                      <button style={{background:"var(--acc)",border:"none",borderRadius:7,padding:"7px 14px",color:"#000",fontWeight:800,fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}
                        onClick={()=>{
                          const fecha=document.getElementById("fecha-dt-"+ase.replace(/ /g,"_"))?.value;
                          const monto=document.getElementById("monto-dt-"+ase.replace(/ /g,"_"))?.value;
                          if(fecha&&monto){ saveDatoTienda(ase,fecha,monto); document.getElementById("monto-dt-"+ase.replace(/ /g,"_")).value=""; }
                        }}>
                        💾 Guardar
                      </button>
                    </div>
                  </div>

                  {dias.length===0?(
                    <div style={{padding:"12px 16px",color:"var(--mut)",fontSize:12}}>Sin ventas registradas aún — puedes agregar dato de tienda arriba</div>

                    <div style={{padding:"10px 16px"}}>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10,marginTop:6}}>
                        {dias.map(({dia,com,dato,total,q})=>{
                          const key=dia+"_"+ase.replace(/ /g,"_");
                          return(
                          <div key={dia} style={{background:"var(--sur2)",borderRadius:10,padding:"11px 13px",border:"1px solid var(--bor)"}}>
                            <div style={{fontSize:10,color:"var(--mut)",fontWeight:700,marginBottom:6,textTransform:"uppercase"}}>{fmtD(dia)}</div>
                            {/* Comisión de paquetes */}
                            {q>0&&<div style={{marginBottom:5}}>
                              <div style={{fontSize:9,color:"var(--mut)",textTransform:"uppercase"}}>Comisión paquetes ({q})</div>
                              <div style={{fontFamily:"var(--mono)",fontSize:14,fontWeight:700,color:"var(--grn)"}}>{fmt(com)}</div>
                            </div>}
                            {/* Dato de tienda */}
                            <div style={{marginBottom:6}}>
                              <div style={{fontSize:9,color:"var(--acc)",textTransform:"uppercase",fontWeight:700,marginBottom:3}}>🏪 Dato de Tienda</div>
                              <div style={{display:"flex",gap:5,alignItems:"center"}}>
                                <input
                                  type="number"
                                  placeholder="₡ 0"
                                  defaultValue={dato||""}
                                  id={"dt-"+key}
                                  style={{flex:1,background:"var(--sur)",border:"1px solid var(--bor)",borderRadius:6,padding:"5px 8px",color:"var(--txt)",fontFamily:"var(--mono)",fontSize:12,width:"100%"}}
                                />
                                <button style={{background:"var(--acc)",border:"none",borderRadius:6,padding:"5px 9px",color:"#000",fontWeight:800,fontSize:11,cursor:"pointer"}}
                                  onClick={()=>{ const v=document.getElementById("dt-"+key)?.value; saveDatoTienda(ase,dia,v); }}>

                                </button>
                              </div>
                            </div>
                            {/* Total del día */}
                            <div style={{borderTop:"1px solid var(--bor)",paddingTop:6,marginTop:4}}>
                              <div style={{fontSize:9,color:"var(--mut)",textTransform:"uppercase"}}>Total del día</div>
                              <div style={{fontFamily:"var(--mono)",fontSize:16,fontWeight:800,color:"var(--grn)"}}>{fmt(total)}</div>
                            </div>
                          </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="ranking"&&(
          <div>
            {/* Filtro por fecha */}
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--sur)",border:"1px solid var(--bor)",borderRadius:9,padding:"8px 14px"}}>
                <span>📅</span>
                <span style={{fontSize:11,color:"var(--mut)",fontWeight:700,textTransform:"uppercase"}}>Filtrar por día:</span>
                <input type="date" className="finp" style={{border:"none",background:"transparent",padding:0,width:"auto",fontSize:13}}

              {filtRanking&&(
                <button className="btn btn-gho" style={{fontSize:12,padding:"7px 13px"}} onClick={()=>setFiltRanking("")}>

            <div className="card" style={{marginBottom:16}}>
              <div className="card-ttl"><span>👩</span>Ranking de Ventas — Asesoras</div>
              <div style={{display:"flex",flexDirection:"column",gap:11}}>
                {rankAse.map((a,i)=>(
                  <div key={a.n} style={{background:"var(--sur2)",borderRadius:11,padding:"13px 16px",border:i===0?"1px solid rgba(255,209,0,.4)":"1px solid var(--bor)"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:9}}>
                        <span style={{fontSize:24}}>{MEDALLAS[i]}</span>
                        <div><div style={{fontWeight:800,fontSize:14}}>{a.n}</div><div style={{fontSize:10,color:"var(--mut)",fontFamily:"var(--mono)"}}>{a.q} paquete{a.q!==1?"s":""}</div></div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:11,color:"var(--mut)",fontWeight:600,textTransform:"uppercase",marginBottom:2}}>Comisión</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:800,color:"var(--grn)"}}>{fmt(a.c)}</div>
                      </div>
                    </div>
                    <div style={{background:"var(--bor)",borderRadius:4,height:5,overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:4,width:`${(a.v/maxV)*100}%`,background:i===0?"linear-gradient(90deg,var(--yel),var(--acc2))":i===1?"linear-gradient(90deg,var(--mut),#8899bb)":"linear-gradient(90deg,var(--acc),var(--grn))",transition:"width .5s"}}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="card">
              <div className="card-ttl"><span>🏪</span>Ranking de Ventas — Tiendas</div>
              <div style={{display:"flex",flexDirection:"column",gap:11}}>
                {rankTie.map((t,i)=>(
                  <div key={t.n} style={{background:"var(--sur2)",borderRadius:11,padding:"13px 16px",border:i===0?"1px solid rgba(255,209,0,.4)":"1px solid var(--bor)"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:9}}>
                        <span style={{fontSize:24}}>{MEDALLAS[i]}</span>
                        <div><div style={{fontWeight:800,fontSize:14}}>🏪 {t.n}</div><div style={{fontSize:10,color:"var(--mut)",fontFamily:"var(--mono)"}}>{t.q} paquete{t.q!==1?"s":""}</div></div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:11,color:"var(--mut)",fontWeight:600,textTransform:"uppercase",marginBottom:2}}>Comisión</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:20,fontWeight:800,color:"var(--grn)"}}>{fmt(t.c)}</div>
                      </div>
                    </div>
                    <div style={{background:"var(--bor)",borderRadius:4,height:5,overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:4,width:`${(t.v/maxV)*100}%`,background:i===0?"linear-gradient(90deg,var(--yel),var(--acc2))":"linear-gradient(90deg,var(--acc2),var(--yel))",transition:"width .5s"}}/>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </main>

      {/* Modal reporte */}
      {modal?.type==="reporte"&&<div className="modal-bg"><div className="modal">
        <div className="modal-ttl">📧 Enviar reporte al jefe</div>
        <div className="modal-body">Se enviará el reporte con <b>{pkgs.length} paquetes</b> al correo:<br/><b style={{color:"var(--acc)"}}>{jefe||"(sin correo)"}</b></div>
        <div className="modal-actions">
          <button className="btn btn-gho" onClick={()=>setModal(null)}>Cancelar</button>
          <button className="btn btn-grn" onClick={()=>{setModal(null);sendReport(pkgs);}}>Enviar y descargar</button>
        </div>
      </div></div>}

      {modal?.type==="auto"&&<div className="modal-bg"><div className="modal">
        <div className="modal-ttl">⏰ Cierre automático ejecutado</div>
        <div className="modal-body">Son las 7:00 PM. El reporte fue enviado al jefe y descargado automáticamente.</div>
        <div className="modal-actions"><button className="btn btn-pri" onClick={()=>setModal(null)}>Entendido</button></div>
      </div></div>}

      {imgView&&<div className="img-overlay" onClick={()=>setImg(null)}><img src={imgView} alt=""/></div>}
      {toast&&<div className={"toast"+(toast.err?" err":"")}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
